name: Temporary complete browser audit
on:
  push:
    branches: ['fix/research-audit-2026-09-05']
    paths: ['scripts/browser-smoke.mjs', '.github/workflows/browser-audit.yml']
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'AvixoSec/solthara-index' && github.ref == 'refs/heads/fix/research-audit-2026-09-05'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test && npm run validate && npm run build
      - name: Install pinned isolated browser tooling
        run: |
          npm install --prefix /tmp/solthara-browser --no-package-lock --ignore-scripts playwright@1.55.0
          node /tmp/solthara-browser/node_modules/playwright/cli.js install chromium
      - name: Exercise complete dataset and interaction flows
        id: browser
        continue-on-error: true
        env:
          PLAYWRIGHT_MODULE: /tmp/solthara-browser/node_modules/playwright/index.mjs
        run: node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-browser-evidence
          path: |
            audit/browser-results.json
            audit/screenshots/
          retention-days: 14
      - name: Publish bounded evidence to this branch only
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const branch='fix/research-audit-2026-09-05';
            if(context.repo.owner!=='AvixoSec'||context.repo.repo!=='solthara-index'||context.ref!==`refs/heads/${branch}`)throw Error('Unexpected branch');
            const api={owner:context.repo.owner,repo:context.repo.repo};
            const ref=await github.rest.git.getRef({...api,ref:`heads/${branch}`});
            if(ref.data.object.sha!==context.sha)throw Error('Branch advanced; refusing to overwrite');
            const run='https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            const report=fs.existsSync('audit/browser-results.json')?JSON.parse(fs.readFileSync('audit/browser-results.json','utf8')):{status:'failed',results:[],error:'Browser setup/build failed; inspect the linked run.'};
            const ok='${{ steps.browser.outcome }}'==='success'&&report.status==='passed';
            report.status=ok?'passed':'failed';report.workflow_url=run;report.source_commit=context.sha;
            fs.writeFileSync('audit/browser-results.json',JSON.stringify(report,null,2)+'\n');
            const verification=JSON.parse(fs.readFileSync('audit/verification.json','utf8'));
            verification.status=ok?'passed':'browser_failed';verification.browser={status:report.status,workflow_url:run,report:'audit/browser-results.json',source_commit:context.sha};
            fs.writeFileSync('audit/verification.json',JSON.stringify(verification,null,2)+'\n');
            const entries=[];
            for(const path of ['audit/browser-results.json','audit/verification.json']){
              const blob=await github.rest.git.createBlob({...api,content:fs.readFileSync(path,'utf8'),encoding:'utf-8'});
              entries.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const base=await github.rest.git.getCommit({...api,commit_sha:context.sha});
            const tree=await github.rest.git.createTree({...api,base_tree:base.data.tree.sha,tree:entries});
            const commit=await github.rest.git.createCommit({...api,parents:[context.sha],tree:tree.data.sha,message:ok?'test: record complete browser audit results':'test: record browser regression diagnostics'});
            await github.rest.git.updateRef({...api,ref:`heads/${branch}`,sha:commit.data.sha,force:false});
            if(!ok)core.setFailed('Browser verification failed; see audit/browser-results.json.');
